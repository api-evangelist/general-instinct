aid: general-instinct
name: General Instinct
description: >-
  General Instinct is a San Francisco company (Y Combinator Spring 2026) building the deployment layer
  for physical AI. Founded in 2026 by Bill Jiao and Guanming Wang, it distills, quantizes, and deploys
  large frontier AI models onto constrained edge hardware so robotics, drone, and physical-AI teams can
  run low-latency models fully offline on devices like NVIDIA Jetson, mobile NPUs, ARM CPUs, the Apple
  Neural Engine, and Snapdragon. Its first product, Instinct Edge, takes a model, a target device, and a
  latency budget and returns an offline runtime that hits the budget on-device with no cloud calls,
  handling model compression, custom kernel optimization (CUDA, Metal, ARM NEON), and the data-to-serving
  pipeline. It was surfaced as a Y Combinator portfolio company and added to the API Evangelist network
  as a stub; enrichment searched the public web and found a marketing landing page but no developer
  portal, documentation, OpenAPI, SDKs, or public API surface, so no API artifacts could be harvested.
  This profile captures the company identity plus the security posture of its public web surface, and
  remains an identity-only lead pending a discoverable API.
